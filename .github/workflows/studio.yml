name: studio

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # A first `dart run` builds OpenCV for the phones' finder (opencv_dart's build hook) for the host, which takes
      # minutes; done here, so the word-file test's own `dart run` (30 s) finds it built.
      - run: dart run tool/l10n_from_messages.dart --check
      # The pixel comparisons only hold on the Mac, where their fixtures were drawn (dart_test.yaml).
      - run: flutter test --exclude-tags pixels
